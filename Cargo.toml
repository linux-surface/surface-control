[package]
name = "surface"
version = "0.5.1"
authors = ["Maximilian Luz <luzmaximilian@gmail.com>"]
description = "Control various aspects of Microsoft Surface devices on Linux from the Command-Line"

repository = "https://github.com/linux-surface/surface-control"
readme = "README.md"
license = "MIT"

edition = "2018"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ['cargo'] }
indoc = "2.0.8"
nix = "0.31.3"
sdtx = { git = "https://github.com/linux-surface/libsurfacedtx", tag = "v0.1.8" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
udev = "0.9.3"

[build-dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ['cargo'] }
clap_complete = "4.6.11"
indoc = "2.0.8"
nix = "0.31.3"
sdtx = { git = "https://github.com/linux-surface/libsurfacedtx", tag = "v0.1.8" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
udev = "0.9.3"

[profile.release]
lto = true
codegen-units = 1
